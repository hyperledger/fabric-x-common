syntax = "proto3";

option go_package = "github.com/hyperledger/fabric-x-common/api/committerpb";

package committerpb;

import "google/protobuf/empty.proto";
import "common/common.proto";

// AuthService is the central authentication and authorization service. It hands out single-use
// challenges (IssueNonce), authenticates clients from a signed envelope and issues cert-bound opaque
// tokens (AuthenticateIdentity), and authorizes a token against a resource policy for a resource
// server (AuthorizeIdentity). Only the AuthService can resolve a token; resource servers delegate every
// decision here.
//
// Flow:
//
//   client           AuthService                      resource server
//     | IssueNonce()     |                                   |
//     |----------------->| nonce                             |
//     |<-----------------|                                   |
//     | AuthenticateIdentity(envelope signed over nonce)     |
//     |----------------->| token                             |
//     |<-----------------|                                   |
//     | RPC + token -------------------------------------->  |
//     |                  |<-- AuthorizeIdentity(token, rpc) -|
//     |                  |--- allowed, token_expires_at ---->|
service AuthService {
    // IssueNonce issues a single-use, short-lived nonce the client must embed in the SignatureHeader of
    // the envelope it then presents to AuthenticateIdentity. It is the mandatory first step of
    // authentication: because the server chooses the nonce and consumes it on use, a captured envelope
    // cannot be replayed even within the freshness window.
    rpc IssueNonce(google.protobuf.Empty) returns (IssueNonceResponse);
    // AuthenticateIdentity verifies a signed envelope and issues a short-lived, cert-bound opaque token.
    rpc AuthenticateIdentity(AuthenticateIdentityRequest) returns (AuthenticateIdentityResponse);
    // AuthorizeIdentity evaluates a token against a resource policy for a resource server. A stream calls it
    // again with the same token whenever its cached decision lapses, so token expiry and configuration
    // changes both take effect on an established stream.
    //
    // It is part of the client API too: a client can call it on its own token to check that the token is
    // still accepted for a resource and when it expires (token_expires_at), so it renews the token before
    // its RPCs start failing rather than after. The client passes its own TLS certificate hash, the one
    // the token is bound to.
    rpc AuthorizeIdentity(AuthorizeIdentityRequest) returns (AuthorizeIdentityResponse);
}

message IssueNonceResponse {
    // nonce is the server-issued challenge the client places in its envelope's SignatureHeader.Nonce.
    // It is valid for a single AuthenticateIdentity call and expires at expires_at.
    bytes nonce = 1;
    // expires_at is the nonce expiry in unix seconds.
    int64 expires_at = 2;
}

message AuthenticateIdentityRequest {
    // signed_envelope carries the client's serialized MSP identity
    // and a signature over the payload; under mutual TLS its ChannelHeader also carries the TLS
    // certificate hash the token is bound to. Its SignatureHeader.Nonce must be an unconsumed nonce
    // previously issued by IssueNonce.
    common.Envelope signed_envelope = 1;
    // requested_scope optionally narrows the token's authority to these gRPC full-method names
    // (least privilege). A requested scope may only narrow, never broaden, the identity's authority.
    repeated string requested_scope = 2;
}

message AuthenticateIdentityResponse {
    // token is the issued cert-bound opaque token the client attaches to subsequent RPCs.
    string token = 1;
    // expires_at is the token expiry in unix seconds.
    int64 expires_at = 2;
}

message AuthorizeIdentityRequest {
    // token is the client's token, forwarded by the resource server.
    string token = 1;
    // resource is the gRPC full method being authorized, e.g. "/committerpb.QueryService/GetRows".
    string resource = 2;
    // tls_cert_hash is the SHA-256 of the caller's TLS certificate observed at the resource server.
    // It is empty when the caller connected without a client certificate.
    bytes tls_cert_hash = 3;
}

// AuthorizeIdentityResponse is returned only when the identity satisfies the resource policy: every other outcome is a
// gRPC status error (Unauthenticated for an invalid, expired, or unknown token or a certificate mismatch;
// PermissionDenied for a scope or policy denial; Unavailable before the configuration is loaded).
message AuthorizeIdentityResponse {
    // token_expires_at is the bound token's expiry in unix seconds. A resource server ends a stream at it,
    // so an expired token cannot keep an established stream alive.
    int64 token_expires_at = 1;
}
